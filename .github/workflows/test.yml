name: PowerShell tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run parser and monitor tests
        shell: powershell
        run: |
          $files = @(
            'OneDriveSyncMonitor.ps1',
            'Update-OneDriveSyncMonitor.ps1',
            'Install-OneDriveSyncMonitor.ps1',
            'Uninstall-OneDriveSyncMonitor.ps1',
            'Test-OneDriveSyncMonitor.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
          .\Test-OneDriveSyncMonitor.ps1
          .\Test-MultiLibrarySync.ps1
          .\Test-MultiLibraryRecovery.ps1
          .\Test-MultiLibrarySetup.ps1
          .\Test-BidirectionalRepair.ps1
          .\Test-UiActions.ps1
